x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"
    compress: "${LOG_COMPRESS:-true}"
services:
  vscgallery-tun:
    container_name: vscgallery-tun
    image: ferronserver/ferron:2
    restart: unless-stopped
    logging: *default-logging
    configs:
      - source: vscgallery-tun-reverse
        target: /etc/ferron.kdl
    networks:
      - vscgallery-tun-workspace-network
configs:
  vscgallery-tun-reverse:
    content: |-
      * {
          include "/etc/ferron.d/**/*.kdl"
          location "/extensions" {
              proxy "https://main.vscode-cdn.net"
          }
          location "/" {
              proxy "https://marketplace.visualstudio.com"
          }
      }
networks:
  vscgallery-tun-workspace-network:
    external: true
