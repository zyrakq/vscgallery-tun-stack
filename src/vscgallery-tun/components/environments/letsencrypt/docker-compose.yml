services:
  vscgallery-tun:
    environment:
      VIRTUAL_PORT: ${VIRTUAL_PORT:-443}
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PROTO: ${VIRTUAL_PROTO:-https}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    configs:
      - source: vscgallery-tun-tls
        target: /etc/ferron.d/tls/cert.kdl
    volumes:
      - letsencrypt-certs:/certs
    networks:
      - letsencrypt-network

volumes:
  letsencrypt-certs:
    external: true

configs:
  vscgallery-tun-tls:
    content: |
      * {
          tls "/certs/${VIRTUAL_HOST}.crt" "/certs/${VIRTUAL_HOST}.key"
      }

networks:
  letsencrypt-network:
    external: true